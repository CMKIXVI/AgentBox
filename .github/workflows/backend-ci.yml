name: AgentBox backend CI

on:
  push:
    paths:
      - "backend/**"
      - "schemas/agent-manifest-v1.schema.json"
      - "examples/agent-manifest-v1.json"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "schemas/agent-manifest-v1.schema.json"
      - "examples/agent-manifest-v1.json"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Temporary lint-fix diagnostic
        run: |
          ruff check --fix app tests || true
          git diff -- backend/app backend/tests
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: pytest
