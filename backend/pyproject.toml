[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agentbox-backend"
version = "0.1.0"
description = "AgentBox agent registry and lifecycle API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "jsonschema[format]>=4.23,<5.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "cryptography>=43,<47",
  "psycopg[binary]>=3.2,<4.0",
]

[project.scripts]
agentbox-tenant = "app.tenant_admin:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
